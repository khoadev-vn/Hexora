name: 'Hexora Security Gate'
description: 'Next-Gen Universal Security Engine: Deterministic SAST, Adversarial Verification & Dynamic Patching'
author: 'Hexora Security Team'
branding:
  icon: 'shield'
  color: 'blue'

inputs:
  path:
    description: 'Path of the directory or project to audit'
    required: false
    default: '.'
  fail-on-critical:
    description: 'Whether to fail the CI step if Critical vulnerabilities are found'
    required: false
    default: 'true'

runs:
  using: 'composite'
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Run Hexora Security Audit
      shell: bash
      run: |
        npx --yes hexora ${{ inputs.path }}

    - name: Upload Security Artifacts
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: hexora-audit-reports
        path: |
          hexora-report.html
          .hexora-results/
